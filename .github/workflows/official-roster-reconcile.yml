name: Moonshot - Reconcile Six NBA.com Team Rosters (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nba-official-roster-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out dedicated Moonshot data repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTML parser and single-request HTTP client
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'requests>=2.31,<3'

      - name: Validate roster parsing, conflicts and no-bet guards offline
        run: python -m unittest -v test_official_roster_reconcile

      - name: Fetch six live NBA.com team roster pages and compare with Oct 13 ID audit
        run: python official_roster_reconcile.py --preflight published/roster_preflight_2027.json --out published/official_roster_page_comparison_2027.json

      - name: Verify provenance, all six teams, and permanent final-roster safety gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('published/official_roster_page_comparison_2027.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['schema']=='nba-moonshot-official-page-reconciliation/v1'
          assert r['season']==2027
          assert r['source_kind']=='NBA_COM_CURRENT_TEAM_PAGE_NOT_FINAL_RELEASE'
          assert len(r['sources'])==6
          assert {s['team'] for s in r['sources']}=={'BOS','DET','PHI','NYK','OKC','SAS'}
          assert all(s['http_status']==200 and s['source_url'].startswith('https://www.nba.com/team/161061') for s in r['sources'])
          assert r['counts']['prior_preseason_entries']==125
          assert 60<=r['counts']['nba_page_players']<=150
          assert r['counts']['nba_page_players']==len(r['players'])
          assert r['opening_night_final_roster_certified'] is False
          assert r['game_day_availability_certified'] is False
          assert r['paid_sgo_allowed'] is False
          print('NBA.com team-page audit PASSED with explicit final-roster and paid-board safeguards')
          print('Counts:',r['counts'])
          print('Identity issues:',r['issues'])
          PY

      - name: Publish separate provisional NBA.com PAGE audit (never overwrite Moonshot Sheet)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published/official_roster_page_comparison_2027.json
          if git diff --cached --quiet; then
            echo 'Roster comparison unchanged; no commit needed.'
          else
            git commit -m 'Publish manual NBA.com six-team roster PAGE comparison (provisional)'
            git push
          fi
          echo 'NBA.com roster page comparison completed. Official opening-night roster release: NOT CERTIFIED. Paid SGO: BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
